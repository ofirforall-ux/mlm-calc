<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ניהול שיווק רשתי</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root {
      --bg-dark: #0f0b16;
      --bg-card: #181222;
      --bg-card-light: #211832;
      --border: #34264a;
      --accent-purple: #8b5cf6;
      --accent-purple-light: #a78bfa;
      --text-main: #f5f3ff;
      --text-muted: #aaa3b8;
      --success: #22c55e;
      --danger: #ef4444;
      --warning: #f59e0b;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: var(--bg-dark);
      color: var(--text-main);
      min-height: 100vh;
    }

    button,
    input,
    select {
      font-family: inherit;
    }

    .topbar {
      height: 64px;
      background: #120d1b;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 20px;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .brand {
      font-size: 1.25rem;
      font-weight: 700;
      color: var(--accent-purple-light);
    }

    .menu-wrap {
      position: relative;
    }

    .menu-btn {
      background: var(--bg-card);
      color: var(--text-main);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px 14px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .dropdown {
      display: none;
      position: absolute;
      top: 48px;
      left: 0;
      min-width: 220px;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 12px;
      box-shadow: 0 12px 30px rgba(0,0,0,.4);
      overflow: hidden;
      z-index: 200;
    }

    .dropdown.active {
      display: block;
    }

    .dropdown button {
      width: 100%;
      padding: 13px 15px;
      border: 0;
      background: transparent;
      color: var(--text-main);
      text-align: right;
      cursor: pointer;
    }

    .dropdown button:hover {
      background: var(--bg-card-light);
    }

    .container {
      width: min(1500px, 96%);
      margin: 20px auto;
    }

    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 18px;
    }

    .card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 18px;
      box-shadow: 0 10px 30px rgba(0,0,0,.18);
    }

    .card-title {
      font-size: 1.15rem;
      font-weight: 700;
      margin-bottom: 15px;
      color: var(--accent-purple-light);
    }

    .form-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0,1fr));
      gap: 12px;
    }

    .field {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .field.full {
      grid-column: 1 / -1;
    }

    label {
      color: var(--text-muted);
      font-size: .9rem;
    }

    input,
    select {
      width: 100%;
      background: #100c17;
      color: var(--text-main);
      border: 1px solid var(--border);
      border-radius: 9px;
      padding: 11px 12px;
      outline: none;
    }

    input:focus,
    select:focus {
      border-color: var(--accent-purple);
    }

    .btn {
      border: 0;
      border-radius: 9px;
      padding: 11px 15px;
      cursor: pointer;
      font-weight: 700;
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }

    .btn-primary {
      background: var(--accent-purple);
      color: white;
    }

    .btn-primary:hover {
      filter: brightness(1.1);
    }

    .btn-success {
      background: var(--success);
      color: #06130a;
    }

    .btn-danger {
      background: var(--danger);
      color: white;
    }

    .btn-secondary {
      background: #31233f;
      color: var(--text-main);
    }

    .tree-card {
      margin-top: 18px;
    }

    #tree {
      overflow-x: auto;
      padding: 25px 10px;
      min-height: 220px;
    }

    .tree,
    .tree ul {
      padding-top: 20px;
      position: relative;
    }

    #tree ul {
      list-style: none;
      margin: 0;
      padding-left: 0;
      padding-right: 0;
      display: flex;
      justify-content: center;
    }

    #tree li {
      position: relative;
      padding: 20px 10px 0;
      text-align: center;
    }

    #tree li::before,
    #tree li::after {
      content: '';
      position: absolute;
      top: 0;
      width: 50%;
      height: 20px;
      border-top: 1px solid var(--border);
    }

    #tree li::before {
      right: 50%;
    }

    #tree li::after {
      left: 50%;
      border-right: 1px solid var(--border);
    }

    #tree li:only-child::before,
    #tree li:only-child::after {
      display: none;
    }

    #tree li:first-child::before {
      border: 0;
    }

    #tree li:last-child::after {
      border: 0;
    }

    #tree ul ul::before {
      content: '';
      position: absolute;
      top: 0;
      right: 50%;
      width: 0;
      height: 20px;
      border-right: 1px solid var(--border);
    }

    .node {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: #211832;
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 11px 15px;
      cursor: pointer;
      min-width: 150px;
      justify-content: center;
      transition: .15s;
    }

    .node:hover,
    .node.selected {
      border-color: var(--accent-purple);
      box-shadow: 0 0 0 2px rgba(139,92,246,.15);
    }

    .node-name {
      font-weight: 700;
      word-break: break-word;
    }

    .selected-user-card {
      margin-top: 18px;
      display: none;
    }

    .selected-user-card.active {
      display: block;
    }

    .user-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 15px;
      flex-wrap: wrap;
    }

    .user-main-info {
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    .user-title {
      font-size: 1.3rem;
      font-weight: 700;
    }

    .user-subtitle {
      color: var(--text-muted);
    }

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0,1fr));
      gap: 10px;
      margin-top: 15px;
    }

    .stat {
      background: #120d1b;
      border: 1px solid var(--border);
      border-radius: 11px;
      padding: 12px;
    }

    .stat-label {
      color: var(--text-muted);
      font-size: .82rem;
      margin-bottom: 5px;
    }

    .stat-value {
      font-size: 1.1rem;
      font-weight: 700;
    }

    .investment-card {
      margin-top: 18px;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 18px;
    }

    .investment-card.unlocked-card {
      border-color: rgba(34,197,94,.55);
    }

    .investment-list {
      display: grid;
      gap: 12px;
    }

    .investment-item {
      background: #120d1b;
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px;
    }

    .investment-item.released {
      opacity: .72;
    }

    .investment-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      flex-wrap: wrap;
    }

    .investment-type {
      font-weight: 700;
      color: var(--accent-purple-light);
    }

    .investment-status {
      font-size: .85rem;
      padding: 5px 8px;
      border-radius: 7px;
      background: #31233f;
    }

    .investment-status.success {
      background: rgba(34,197,94,.14);
      color: #86efac;
    }

    .investment-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0,1fr));
      gap: 10px;
      margin-top: 12px;
    }

    .investment-stat {
      background: #181222;
      border-radius: 9px;
      padding: 9px;
    }

    .investment-stat-label {
      display: block;
      color: var(--text-muted);
      font-size: .78rem;
      margin-bottom: 4px;
    }

    .investment-stat-value {
      font-weight: 700;
    }

    .investment-actions {
      margin-top: 12px;
      display: flex;
      justify-content: flex-end;
    }

    .investment-timer-msg {
      margin-top: 10px;
      color: var(--text-muted);
      min-height: 24px;
    }

    .unlocked-text {
      color: #86efac;
    }

    .no-data-msg {
      text-align: center;
      color: var(--text-muted);
      padding: 40px 15px;
    }

    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.72);
      z-index: 500;
      align-items: center;
      justify-content: center;
      padding: 15px;
    }

    .modal-overlay.active {
      display: flex;
    }

    .modal {
      width: min(620px, 100%);
      max-height: 90vh;
      overflow-y: auto;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 20px;
    }

    .modal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 15px;
    }

    .modal-title {
      font-size: 1.2rem;
      font-weight: 700;
      color: var(--accent-purple-light);
    }

    .close-btn {
      background: transparent;
      border: 0;
      color: var(--text-muted);
      font-size: 1.3rem;
      cursor: pointer;
    }

    .modal-actions {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
      margin-top: 15px;
    }

    .wallet-box {
      margin-top: 15px;
      background: #120d1b;
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px;
    }

    .wallet-title {
      color: var(--text-muted);
      font-size: .9rem;
    }

    .wallet-value {
      font-size: 1.5rem;
      font-weight: 700;
      margin-top: 5px;
    }

    @media (max-width: 900px) {
      .grid {
        grid-template-columns: 1fr;
      }

      .stats-grid {
        grid-template-columns: repeat(2, minmax(0,1fr));
      }

      .investment-grid {
        grid-template-columns: repeat(2, minmax(0,1fr));
      }
    }

    @media (max-width: 600px) {
      .container {
        width: 94%;
      }

      .form-grid {
        grid-template-columns: 1fr;
      }

      .field.full {
        grid-column: auto;
      }

      .stats-grid,
      .investment-grid {
        grid-template-columns: 1fr;
      }

      .topbar {
        padding: 0 12px;
      }

      .brand {
        font-size: 1rem;
      }
    }
  </style>
</head>
<body>

  <header class="topbar">
    <div class="brand">ניהול שיווק רשתי</div>

    <div class="menu-wrap">
      <button class="menu-btn" onclick="toggleDropdown()">
        <i class="fa-solid fa-bars"></i>
        תפריט
      </button>

      <div id="dropdownMenu" class="dropdown">
        <button onclick="openModal('passModal'); closeDropdown();">
          <i class="fa-solid fa-key"></i>
          שינוי סיסמה לפי כינוי
        </button>
        <button onclick="openModal('rankModal'); closeDropdown();">
          <i class="fa-solid fa-ranking-star"></i>
          הגדרות דרגה
        </button>
        <button onclick="resetSystemData()">
          <i class="fa-solid fa-rotate-left"></i>
          איפוס נתונים
        </button>
      </div>
    </div>
  </header>

  <main class="container">

    <div class="grid">

      <section class="card">
        <div class="card-title">
          <i class="fa-solid fa-user-plus"></i>
          הוספת משתמש
        </div>

        <form id="addUserForm" onsubmit="addUser(event)">
          <div class="form-grid">

            <div class="field">
              <label>מנהל נותן חסות</label>
              <select id="uSponsor"></select>
            </div>

            <div class="field">
              <label>מזהה ארגון</label>
              <input id="uOrgId" type="text">
            </div>

            <div class="field">
              <label>כינוי</label>
              <input id="uUsername" type="text" required>
            </div>

            <div class="field">
              <label>שם</label>
              <input id="uName" type="text" required>
            </div>

            <div class="field">
              <label>אימייל</label>
              <input id="uEmail" type="email">
            </div>

            <div class="field">
              <label>סיסמה</label>
              <input id="uPass" type="password">
            </div>

            <div class="field">
              <label>סכום השקעה</label>
              <input id="uInvest" type="number" min="0" step="0.01">
            </div>

            <div class="field">
              <label>סוג השקעה</label>
              <select id="uInvestmentType">
                <option value="thunder">Thunder Stake</option>
                <option value="unai">UNAI Engine</option>
              </select>
            </div>

            <div class="field">
              <label>ריבית חודשית (%)</label>
              <input id="uMonthlyRate" type="number" min="0" step="0.01">
            </div>

            <div class="field">
              <label>חודשים ללא עמלה</label>
              <input id="uFeeFreeMonths" type="number" min="0" step="0.01">
            </div>

            <div class="field full">
              <button class="btn btn-primary" type="submit">
                <i class="fa-solid fa-user-plus"></i>
                הוסף משתמש
              </button>
            </div>

          </div>
        </form>
      </section>

      <section class="card">
        <div class="card-title">
          <i class="fa-solid fa-circle-info"></i>
          מידע
        </div>

        <div class="wallet-box">
          <div class="wallet-title">המערכת</div>
          <div class="wallet-value">ניהול רשת והשקעות</div>
        </div>

        <div class="wallet-box">
          <div class="wallet-title">UNAI Engine</div>
          <div class="wallet-value">ריבית דריבית עד הבשלה של שנתיים</div>
        </div>

        <div class="wallet-box">
          <div class="wallet-title">Thunder Stake</div>
          <div class="wallet-value">ריבית יומית לארנק + שחרור קרן</div>
        </div>
      </section>

    </div>

    <section class="card tree-card">
      <div class="card-title">
        <i class="fa-solid fa-sitemap"></i>
        עץ הרשת
      </div>
      <div id="tree"></div>
    </section>

    <section id="selectedUserCard" class="card selected-user-card">

      <div class="user-header">
        <div class="user-main-info">
          <div id="selectedUserTitle" class="user-title"></div>
          <div id="selectedUserSubtitle" class="user-subtitle"></div>
        </div>

        <div>
          <button class="btn btn-primary" onclick="openTransferModal()">
            <i class="fa-solid fa-money-bill-transfer"></i>
            העברת כסף
          </button>
        </div>
      </div>

      <div class="stats-grid">
        <div class="stat">
          <div class="stat-label">ארנק</div>
          <div id="walletBalance" class="stat-value">$0.00</div>
        </div>

        <div class="stat">
          <div class="stat-label">השקעה כוללת</div>
          <div id="totalInvest" class="stat-value">$0.00</div>
        </div>

        <div class="stat">
          <div class="stat-label">מכירות</div>
          <div id="salesValue" class="stat-value">0</div>
        </div>

        <div class="stat">
          <div class="stat-label">חברי קבוצה</div>
          <div id="membersValue" class="stat-value">0</div>
        </div>
      </div>

      <div id="investCard" class="investment-card">
        <div class="card-title">
          <i class="fa-solid fa-chart-line"></i>
          השקעות
        </div>

        <div id="investmentList" class="investment-list"></div>

        <div id="investTimerMsg" class="investment-timer-msg"></div>

        <button class="btn btn-primary" style="width:100%; margin-top:10px; justify-content:center;" onclick="openInvestmentModal()">
          <i class="fa-solid fa-plus"></i>
          הוסף השקעה למשתמש
        </button>
      </div>

    </section>

  </main>

  <div id="investmentModal" class="modal-overlay">
    <div class="modal">

      <div class="modal-header">
        <div class="modal-title">
          <i class="fa-solid fa-coins"></i>
          הוספת השקעה
        </div>
        <button class="close-btn" onclick="closeModal('investmentModal')">&times;</button>
      </div>

      <div id="investmentModalUser" class="user-subtitle"></div>

      <div class="form-grid" style="margin-top:15px;">

        <div class="field">
          <label>סכום השקעה</label>
          <input id="newInvestmentAmount" type="number" min="0" step="0.01">
        </div>

        <div class="field">
          <label>ריבית חודשית (%)</label>
          <input id="newInvestmentMonthlyRate" type="number" min="0" step="0.01">
        </div>

        <div class="field">
          <label>חודשים ללא עמלה</label>
          <input id="newInvestmentFeeMonths" type="number" min="0" step="0.01">
        </div>

        <div class="field">
          <label>סוג השקעה</label>
          <select id="newInvestmentType">
            <option value="thunder">Thunder Stake</option>
            <option value="unai">UNAI Engine</option>
          </select>
        </div>

      </div>

      <div class="modal-actions">
        <button class="btn btn-secondary" onclick="closeModal('investmentModal')">ביטול</button>
        <button class="btn btn-primary" onclick="addInvestmentToSelectedUser()">הוסף השקעה</button>
      </div>

    </div>
  </div>

  <div id="transferModal" class="modal-overlay">
    <div class="modal">

      <div class="modal-header">
        <div class="modal-title">
          <i class="fa-solid fa-money-bill-transfer"></i>
          העברת כסף
        </div>
        <button class="close-btn" onclick="closeModal('transferModal')">&times;</button>
      </div>

      <div id="transferFromUser" class="user-subtitle"></div>

      <div class="form-grid" style="margin-top:15px;">

        <div class="field">
          <label>העברה אל</label>
          <select id="transferToUser"></select>
        </div>

        <div class="field">
          <label>סכום</label>
          <input id="transferAmount" type="number" min="0" step="0.01">
        </div>

      </div>

      <div class="modal-actions">
        <button class="btn btn-secondary" onclick="closeModal('transferModal')">ביטול</button>
        <button class="btn btn-primary" onclick="transferWalletMoney()">העבר כסף</button>
      </div>

    </div>
  </div>

  <div id="passModal" class="modal-overlay">
    <div class="modal">

      <div class="modal-header">
        <div class="modal-title">
          <i class="fa-solid fa-key"></i>
          שינוי סיסמה
        </div>
        <button class="close-btn" onclick="closeModal('passModal')">&times;</button>
      </div>

      <div class="form-grid">

        <div class="field">
          <label>משתמש</label>
          <select id="passUserSelect"></select>
        </div>

        <div class="field">
          <label>סיסמה חדשה</label>
          <input id="newPassVal" type="password">
        </div>

      </div>

      <div class="modal-actions">
        <button class="btn btn-secondary" onclick="closeModal('passModal')">ביטול</button>
        <button class="btn btn-primary" onclick="changePassword(event)">שמור</button>
      </div>

    </div>
  </div>

  <div id="rankModal" class="modal-overlay">
    <div class="modal">

      <div class="modal-header">
        <div class="modal-title">
          <i class="fa-solid fa-ranking-star"></i>
          הגדרות דרגה
        </div>
        <button class="close-btn" onclick="closeModal('rankModal')">&times;</button>
      </div>

      <div class="form-grid">

        <div class="field">
          <label>מכירות</label>
          <input id="cfgSales" type="number" min="0" step="0.01">
        </div>

        <div class="field">
          <label>השקעה</label>
          <input id="cfgInvest" type="number" min="0" step="0.01">
        </div>

        <div class="field">
          <label>חברים</label>
          <input id="cfgMembers" type="number" min="0" step="1">
        </div>

        <div class="field">
          <label>קבוצה</label>
          <input id="cfgGrp" type="number" min="0" step="0.01">
        </div>

      </div>

      <div class="modal-actions">
        <button class="btn btn-secondary" onclick="closeModal('rankModal')">ביטול</button>
        <button class="btn btn-primary" onclick="saveConfig()">שמור</button>
      </div>

    </div>
  </div>

  <script>
    const STORAGE_KEY_TREE = 'mlm_tree_data_v2';
    const STORAGE_KEY_RANK = 'mlm_rank_req_v2';

    const DAY_MS = 24 * 60 * 60 * 1000;
    const UNAI_MATURITY_MS = 2 * 365 * DAY_MS;
    const THUNDER_RELEASE_WINDOW_MS = 72 * 60 * 60 * 1000;

    let treeData = null;
    let selectedId = null;

    let rankReq = {
      sales: 0,
      invest: 0,
      members: 0,
      grp: 0
    };

    function formatMoney(value) {
      const num = parseFloat(value || 0);
      return num.toLocaleString('en-US', {
        minimumFractionDigits: 2,
        maximumFractionDigits: 2
      });
    }

    function getDailyRate(monthlyRate) {
      const rate = parseFloat(monthlyRate || 0);
      if (!Number.isFinite(rate) || rate <= 0) return 0;
      return (rate / 100) / 30;
    }

    function findNode(node, id) {
      if (!node || id == null) return null;
      if (String(node.id) === String(id)) return node;

      if (Array.isArray(node.children)) {
        for (const child of node.children) {
          const found = findNode(child, id);
          if (found) return found;
        }
      }

      return null;
    }

    function getInvestmentCurrentValue(inv) {
      if (inv.releasedToWallet) return 0;

      const amount = parseFloat(inv.amount || 0);
      const monthlyRate = parseFloat(inv.monthlyRate || 0);

      if (amount <= 0 || monthlyRate <= 0) return amount;

      const elapsedMs = Math.max(
        0,
        Date.now() - (inv.createdAt || Date.now())
      );

      const elapsedDays = elapsedMs / DAY_MS;
      const dailyRate = getDailyRate(monthlyRate);

      // הריבית מחושבת לפי האחוז החודשי / 30 ומצטברת בריבית דריבית בכל יום.
      // ב-UNAI Engine החישוב ממשיך גם לאחר סיום הטיימר הראשוני ועד להבשלה של שנתיים.
      return amount * Math.pow(1 + dailyRate, elapsedDays);
    }

    function getFeeFreeEnd(inv) {
      const feeFreeMonths = parseFloat(inv.feeFreeMonths || 0);
      const createdAt = inv.createdAt || Date.now();

      if (feeFreeMonths <= 0) return createdAt;

      return createdAt + (feeFreeMonths * 30.4375 * DAY_MS);
    }

    function getUnaiMaturityEnd(inv) {
      return (inv.createdAt || Date.now()) + UNAI_MATURITY_MS;
    }

    function getThunderWindowStart(inv) {
      if (!inv.thunderWindowStart) return getFeeFreeEnd(inv);
      return inv.thunderWindowStart;
    }

    function getThunderWindowEnd(inv) {
      return getThunderWindowStart(inv) + THUNDER_RELEASE_WINDOW_MS;
    }

    function isThunderEligible(inv) {
      return inv.type === 'thunder' &&
        !inv.principalReleased &&
        Date.now() >= getFeeFreeEnd(inv);
    }

    function isInvestmentReleased(inv) {
      if (!inv) return true;

      if (inv.type === 'unai') {
        return !!inv.releasedToWallet;
      }

      if (inv.type === 'thunder') {
        return !!inv.releasedToWallet;
      }

      return !!inv.releasedToWallet;
    }

    function getInvestmentTimerText(inv) {
      if (!inv) return '';

      if (inv.releasedToWallet) {
        return 'ההשקעה כבר שוחררה לארנק';
      }

      const now = Date.now();

      if (inv.type === 'unai') {
        const maturity = getUnaiMaturityEnd(inv);
        const remaining = maturity - now;

        if (remaining <= 0) {
          return 'ההשקעה הגיעה להבשלה. הקרן והרווחים משתחררים לארנק.';
        }

        return `UNAI Engine — זמן עד הבשלה: ${formatDuration(remaining)} | הריבית ממשיכה להצטבר בריבית דריבית`;
      }

      if (inv.type === 'thunder') {
        const feeEnd = getFeeFreeEnd(inv);

        if (now < feeEnd) {
          return `Thunder Stake — זמן עד סיום התקופה ללא עמלה: ${formatDuration(feeEnd - now)}`;
        }

        const windowStart = getThunderWindowStart(inv);
        const windowEnd = getThunderWindowEnd(inv);

        if (now < windowEnd) {
          return `Thunder Stake — חלון שחרור הקרן פתוח לעוד: ${formatDuration(windowEnd - now)} | הריבית היומית עוברת לארנק`;
        }

        return `Thunder Stake — חלון השחרור הסתיים | הריבית היומית ממשיכה לעבור לארנק`;
      }

      return '';
    }

    function formatDuration(ms) {
      ms = Math.max(0, ms);

      const totalSeconds = Math.floor(ms / 1000);
      const days = Math.floor(totalSeconds / 86400);
      const hours = Math.floor((totalSeconds % 86400) / 3600);
      const minutes = Math.floor((totalSeconds % 3600) / 60);
      const seconds = totalSeconds % 60;

      if (days > 0) {
        return `${days} ימים ${hours} שעות ${minutes} דקות`;
      }

      if (hours > 0) {
        return `${hours} שעות ${minutes} דקות ${seconds} שניות`;
      }

      if (minutes > 0) {
        return `${minutes} דקות ${seconds} שניות`;
      }

      return `${seconds} שניות`;
    }

    function syncLegacyInvestValue(user) {
      if (!user) return;

      if (!Array.isArray(user.investments)) {
        user.investments = [];
      }

      user.invest = user.investments
        .filter(inv => !inv.releasedToWallet)
        .reduce((sum, inv) => {
          return sum + parseFloat(inv.amount || 0);
        }, 0);
    }

    function normalizeInvestment(inv) {
      if (!inv || typeof inv !== 'object') return null;

      if (!inv.id) {
        inv.id = 'inv-' + Date.now().toString() + '-' +
          Math.random().toString(16).slice(2);
      }

      inv.type = inv.type === 'unai' ? 'unai' : 'thunder';
      inv.amount = Number.isFinite(parseFloat(inv.amount))
        ? parseFloat(inv.amount)
        : 0;

      inv.monthlyRate = Number.isFinite(parseFloat(inv.monthlyRate))
        ? parseFloat(inv.monthlyRate)
        : 0;

      inv.feeFreeMonths = Number.isFinite(parseFloat(inv.feeFreeMonths))
        ? parseFloat(inv.feeFreeMonths)
        : 0;

      inv.createdAt = Number.isFinite(parseFloat(inv.createdAt))
        ? parseFloat(inv.createdAt)
        : Date.now();

      inv.releasedToWallet = !!inv.releasedToWallet;
      inv.principalReleased = !!inv.principalReleased;
      inv.maturityReleased = !!inv.maturityReleased;

      if (!Number.isFinite(parseFloat(inv.thunderWindowStart))) {
        inv.thunderWindowStart = null;
      }

      if (!Number.isFinite(parseFloat(inv.lastThunderInterestPayoutAt))) {
        inv.lastThunderInterestPayoutAt = inv.createdAt;
      }

      inv.thunderInterestPaid = Number.isFinite(
        parseFloat(inv.thunderInterestPaid)
      )
        ? parseFloat(inv.thunderInterestPaid)
        : 0;

      return inv;
    }

    function normalizeTreeData(node) {
      if (!node || typeof node !== 'object') return;

      if (!node.children || !Array.isArray(node.children)) {
        node.children = [];
      }

      if (!Array.isArray(node.investments)) {
        node.investments = [];
      }

      node.investments = node.investments
        .map(normalizeInvestment)
        .filter(Boolean);

      if (!Number.isFinite(parseFloat(node.walletBalance))) {
        node.walletBalance = 0;
      }

      node.walletBalance = parseFloat(node.walletBalance || 0);

      if (!Number.isFinite(parseFloat(node.sales))) {
        node.sales = 0;
      }

      node.createdAt = Number.isFinite(parseFloat(node.createdAt))
        ? parseFloat(node.createdAt)
        : Date.now();

      syncLegacyInvestValue(node);

      node.children.forEach(normalizeTreeData);
    }

    function loadStorageData() {
      try {
        const treeRaw = localStorage.getItem(STORAGE_KEY_TREE);
        const rankRaw = localStorage.getItem(STORAGE_KEY_RANK);

        treeData = treeRaw ? JSON.parse(treeRaw) : null;

        if (rankRaw) {
          const parsedRank = JSON.parse(rankRaw);

          rankReq = {
            sales: parseFloat(parsedRank.sales || 0),
            invest: parseFloat(parsedRank.invest || 0),
            members: parseFloat(parsedRank.members || 0),
            grp: parseFloat(parsedRank.grp || 0)
          };
        }

        if (treeData) {
          normalizeTreeData(treeData);
        }
      } catch (err) {
        console.error(err);
        treeData = null;
      }
    }

    function saveStorageData() {
      try {
        if (treeData) {
          normalizeTreeData(treeData);
          localStorage.setItem(
            STORAGE_KEY_TREE,
            JSON.stringify(treeData)
          );
        } else {
          localStorage.removeItem(STORAGE_KEY_TREE);
        }

        localStorage.setItem(
          STORAGE_KEY_RANK,
          JSON.stringify(rankReq)
        );
      } catch (err) {
        console.error(err);
      }
    }

    function processInvestmentWalletEvents(user) {
      if (!user || !Array.isArray(user.investments)) return false;

      let changed = false;
      const now = Date.now();

      if (!Number.isFinite(parseFloat(user.walletBalance))) {
        user.walletBalance = 0;
      }

      user.walletBalance = parseFloat(user.walletBalance || 0);

      user.investments.forEach(inv => {
        if (inv.releasedToWallet) return;

        // UNAI Engine: ממשיך בריבית דריבית עד שנתיים מההשקעה, ואז הקרן + הרווחים נכנסים לארנק.
        if (inv.type === 'unai') {
          if (now >= getUnaiMaturityEnd(inv)) {
            const value = getInvestmentCurrentValue(inv);

            if (value > 0) {
              user.walletBalance += value;
              inv.releasedToWallet = true;
              inv.maturityReleased = true;
              inv.releasedAt = now;
              inv.releasedAmount = value;
              changed = true;
            }
          }

          return;
        }

        // Thunder Stake: לאחר סיום הטיימר, הריבית היומית עוברת לארנק ואינה מצטרפת לקרן.
        if (inv.type === 'thunder') {
          const feeEnd = getFeeFreeEnd(inv);

          if (now < feeEnd || inv.principalReleased) return;

          if (!inv.thunderWindowStart) {
            inv.thunderWindowStart = feeEnd;
            changed = true;
          }

          const last = inv.lastThunderInterestPayoutAt || feeEnd;

          const completedDays = Math.floor(
            Math.max(0, now - last) / DAY_MS
          );

          const dailyRate = getDailyRate(inv.monthlyRate);
          const principal = parseFloat(inv.amount || 0);

          if (completedDays > 0 && principal > 0 && dailyRate > 0) {
            // ריבית יומית על הקרן המקורית, ללא צירוף לקרן.
            const payout = principal * dailyRate * completedDays;

            user.walletBalance += payout;

            inv.lastThunderInterestPayoutAt =
              last + completedDays * DAY_MS;

            inv.thunderInterestPaid =
              parseFloat(inv.thunderInterestPaid || 0) + payout;

            changed = true;
          }
        }
      });

      return changed;
    }

    function render() {
      if (treeData) {
        normalizeTreeData(treeData);
      }

      updateSponsorsAndUsers();
      renderTree();
      renderSelectedUser();

      if (selectedId) {
        const user = findNode(treeData, selectedId);

        if (user) {
          processInvestmentWalletEvents(user);
          renderSelectedUser();
          updateInvestmentTimer();
        }
      }
    }

    function renderSelectedUser() {
      const card = document.getElementById('selectedUserCard');

      if (!treeData || !selectedId) {
        card.classList.remove('active');
        return;
      }

      const user = findNode(treeData, selectedId);

      if (!user) {
        card.classList.remove('active');
        return;
      }

      card.classList.add('active');

      document.getElementById('selectedUserTitle').innerText =
        user.name || user.username || 'משתמש';

      document.getElementById('selectedUserSubtitle').innerText =
        `${user.email || '(ללא אימייל)'} | @${user.username || ''}`;

      document.getElementById('walletBalance').innerText =
        `$${formatMoney(user.walletBalance)}`;

      const totalInvest = (user.investments || [])
        .filter(inv => !inv.releasedToWallet)
        .reduce((sum, inv) => {
          return sum + parseFloat(inv.amount || 0);
        }, 0);

      document.getElementById('totalInvest').innerText =
        `$${formatMoney(totalInvest)}`;

      document.getElementById('salesValue').innerText =
        formatMoney(user.sales || 0);

      document.getElementById('membersValue').innerText =
        countMembers(user);

      renderUserInvestments(user);
    }

    function countMembers(user) {
      let count = 0;

      function walk(node) {
        if (!node || !Array.isArray(node.children)) return;

        node.children.forEach(child => {
          count++;
          walk(child);
        });
      }

      walk(user);
      return count;
    }

    function renderUserInvestments(user) {
      const list = document.getElementById('investmentList');

      if (!user || !Array.isArray(user.investments) ||
          user.investments.length === 0) {
        list.innerHTML =
          '<div class="no-data-msg">אין השקעות למשתמש זה.</div>';
        return;
      }

      const totalCurrent = user.investments.reduce((sum, inv) => {
        return sum + getInvestmentCurrentValue(inv);
      }, 0);

      const totalPrincipal = user.investments.reduce((sum, inv) => {
        return sum + parseFloat(inv.amount || 0);
      }, 0);

      const totalProfit = Math.max(
        0,
        totalCurrent - totalPrincipal
      );

      list.innerHTML = user.investments.map(inv => {
        const current = getInvestmentCurrentValue(inv);
        const principal = parseFloat(inv.amount || 0);
        const profit = Math.max(0, current - principal);

        const isReleased = !!inv.releasedToWallet;

        let typeName =
          inv.type === 'unai'
            ? 'UNAI Engine'
            : 'Thunder Stake';

        let status = '';
        let statusClass = '';

        if (isReleased) {
          status = 'שוחרר לארנק';
          statusClass = 'success';
        } else if (inv.type === 'unai') {
          status = 'פעיל';
        } else {
          status = 'פעיל';
        }

        let actionHtml = '';

        if (inv.type === 'thunder' && !isReleased) {
          actionHtml = `
            <button class="btn btn-success"
                    onclick="releaseInvestmentToWallet('${inv.id}')">
              <i class="fa-solid fa-wallet"></i>
              שחרר קרן לארנק
            </button>`;
        }

        return `
          <div class="investment-item ${isReleased ? 'released' : ''}">
            <div class="investment-head">
              <div class="investment-type">${typeName}</div>
              <div class="investment-status ${statusClass}">
                ${status}
              </div>
            </div>

            <div class="investment-grid">

              <div class="investment-stat">
                <span class="investment-stat-label">קרן</span>
                <span class="investment-stat-value">
                  $${formatMoney(principal)}
                </span>
              </div>

              <div class="investment-stat">
                <span class="investment-stat-label">ריבית חודשית</span>
                <span class="investment-stat-value">
                  ${formatMoney(inv.monthlyRate)}%
                </span>
              </div>

              <div class="investment-stat">
                <span class="investment-stat-label">שווי נוכחי</span>
                <span class="investment-stat-value">
                  $${formatMoney(current)}
                </span>
              </div>

              <div class="investment-stat">
                <span class="investment-stat-label">רווח</span>
                <span class="investment-stat-value">
                  $${formatMoney(profit)}
                </span>
              </div>

            </div>

            <div class="investment-timer-msg">
              <i class="fa-solid fa-clock"></i>
              ${getInvestmentTimerText(inv)}
            </div>

            ${actionHtml}
          </div>
        `;
      }).join('');

      list.insertAdjacentHTML('beforeend', `
        <div class="investment-grid" style="margin-top:14px;">

          <div class="investment-stat">
            <span class="investment-stat-label">שווי נוכחי כולל</span>
            <span class="investment-stat-value">
              $${formatMoney(totalCurrent)}
            </span>
          </div>

          <div class="investment-stat">
            <span class="investment-stat-label">רווח מצטבר כולל</span>
            <span class="investment-stat-value">
              $${formatMoney(totalProfit)}
            </span>
          </div>

          <div class="investment-stat">
            <span class="investment-stat-label">מספר השקעות</span>
            <span class="investment-stat-value">
              ${user.investments.length}
            </span>
          </div>

        </div>
      `);
    }

    function updateInvestmentTimer() {
      let user = findNode(treeData, selectedId);
      let investCard = document.getElementById('investCard');
      let msgElem = document.getElementById('investTimerMsg');

      if (!user || !user.investments ||
          user.investments.length === 0) {

        investCard.classList.remove('unlocked-card');
        msgElem.className = 'investment-timer-msg';
        msgElem.innerText = '';
        return;
      }

      const allReleased =
        user.investments.every(isInvestmentReleased);

      if (allReleased) {
        investCard.classList.add('unlocked-card');
        msgElem.className =
          'investment-timer-msg unlocked-text';

        msgElem.innerHTML =
          `<i class="fa-solid fa-circle-check"></i> ההשקעות פתוחות למשיכה ללא עמלות`;
      } else {
        investCard.classList.remove('unlocked-card');
        msgElem.className = 'investment-timer-msg';

        const active =
          user.investments.find(inv => !isInvestmentReleased(inv));

        msgElem.innerHTML =
          `<i class="fa-solid fa-clock"></i> ${getInvestmentTimerText(active)}`;
      }
    }

    function updateInvestmentTimers() {
      const user = findNode(treeData, selectedId);

      if (!user) return;

      const changed =
        processInvestmentWalletEvents(user);

      if (changed) saveStorageData();

      renderUserInvestments(user);
      updateInvestmentTimer();
    }

    function setCircle(cId, pId, vId, current, target, unit) {
      let pct =
        target > 0
          ? Math.min(100, (current / target) * 100)
          : 100;

      let offset =
        283 - (pct / 100) * 283;

      document.getElementById(cId).style.strokeDashoffset =
        offset;

      document.getElementById(pId).innerText =
        Math.round(pct) + '%';

      let currStr =
        Number.isInteger(current)
          ? current
          : current.toFixed(2);

      let targetStr =
        Number.isInteger(target)
          ? target
          : target.toFixed(2);

      document.getElementById(vId).innerText =
        `${currStr}${unit}/${targetStr}${unit}`;
    }

    function renderTree() {
      let container = document.getElementById('tree');
      container.innerHTML = '';

      if (!treeData) {
        container.innerHTML =
          '<div class="no-data-msg">הרשת ריקה. הוסף משתמש ראשון כמנהל המערכת.</div>';
        return;
      }

      let ul = document.createElement('ul');
      ul.appendChild(buildNode(treeData));
      container.appendChild(ul);
    }

    function buildNode(node) {
      let li = document.createElement('li');
      let div = document.createElement('div');

      let extraClass =
        node.id === selectedId
          ? 'selected'
          : '';

      div.className =
        `node ${extraClass}`;

      div.onclick = (e) => {
        e.stopPropagation();
        selectedId = node.id;
        render();
      };

      div.innerHTML = `
        <i class="fa-solid fa-user"
           style="font-size:0.9rem; color: var(--accent-purple-light);"></i>
        <div class="node-name">${node.name}</div>
      `;

      li.appendChild(div);

      if (node.children &&
          node.children.length > 0) {

        let ul = document.createElement('ul');

        node.children.forEach(c =>
          ul.appendChild(buildNode(c))
        );

        li.appendChild(ul);
      }

      return li;
    }

    function updateSponsorsAndUsers() {
      let sponsorSelect =
        document.getElementById('uSponsor');

      let passUserSelect =
        document.getElementById('passUserSelect');

      sponsorSelect.innerHTML = '';
      passUserSelect.innerHTML = '';

      if (!treeData) {
        let opt = document.createElement('option');

        opt.value = "root_new";
        opt.innerText = "מנהל מערכת (ראשי)";

        sponsorSelect.appendChild(opt);
        return;
      }

      function walk(node) {
        let opt1 =
          document.createElement('option');

        opt1.value = node.id;

        // כאן מוצג רק האימייל של המנהל המצטרף
        opt1.innerText =
          node.email || '(ללא אימייל)';

        sponsorSelect.appendChild(opt1);

        let opt2 =
          document.createElement('option');

        opt2.value = node.id;

        opt2.innerText =
          `${node.username} (${node.name})`;

        passUserSelect.appendChild(opt2);

        if (node.children) {
          node.children.forEach(walk);
        }
      }

      walk(treeData);
    }

    function createInvestmentFromInputs(prefix) {
      const amount =
        parseFloat(
          document.getElementById(
            prefix + 'Amount'
          ).value
        );

      const monthlyRate =
        parseFloat(
          document.getElementById(
            prefix + 'MonthlyRate'
          ).value
        );

      const feeFreeMonths =
        parseFloat(
          document.getElementById(
            prefix + 'FeeMonths'
          ).value
        );

      const type =
        document.getElementById(
          prefix + 'Type'
        ).value;

      return {
        id:
          'inv-' +
          Date.now().toString() +
          '-' +
          Math.random().toString(16).slice(2),

        amount:
          isNaN(amount)
            ? 0
            : amount,

        monthlyRate:
          isNaN(monthlyRate)
            ? 0
            : monthlyRate,

        feeFreeMonths:
          isNaN(feeFreeMonths)
            ? 0
            : feeFreeMonths,

      };

    function addUser(e) {
      e.preventDefault();

      let sponsorId =
        document.getElementById('uSponsor').value;

      const investVal =
        parseFloat(
          document.getElementById('uInvest').value || 0
        );

      let newUser = {
        id: Date.now().toString(),

        orgId:
          document.getElementById('uOrgId').value,

        username:
          document.getElementById('uUsername').value,

        name:
          document.getElementById('uName').value,

        email:
          document.getElementById('uEmail').value,

        pass:
          document.getElementById('uPass').value,

        invest: 0,

        walletBalance: 0,

        investments: [],

        feeFreeMonths: 0,

        createdAt: Date.now(),

        sales: 0,

        children: []
      };

      // אם הוזנה השקעה, היא נשמרת כהשקעה עצמאית עם הנתונים שלה
      if (investVal > 0) {
        newUser.investments.push({
          id:
            'inv-' +
            Date.now().toString() +
            '-' +
            Math.random().toString(16).slice(2),

          type:
            document.getElementById(
              'uInvestmentType'
            ).value,

          amount: investVal,

          monthlyRate:
            parseFloat(
              document.getElementById(
                'uMonthlyRate'
              ).value || 0
            ),

          feeFreeMonths:
            parseFloat(
              document.getElementById(
                'uFeeFreeMonths'
              ).value || 0
            ),

          createdAt: Date.now()
        });
      }

      syncLegacyInvestValue(newUser);

      if (!treeData || sponsorId === "root_new") {
        treeData = newUser;
        selectedId = null;
      } else {
        let parent =
          findNode(treeData, sponsorId);

        if (parent) {
          parent.children.push(newUser);
        }
      }

      document.getElementById(
        'addUserForm'
      ).reset();

      saveStorageData();
      render();
    }

      document.getElementById(
        'newInvestmentFeeMonths'
      ).value = '';

      ).value = 'thunder';

      document.getElementById(
        'investmentModal'
      ).classList.add('active');
    }

    function addInvestmentToSelectedUser() {
      const user =
        findNode(treeData, selectedId);

      if (!user) return;

      if (!Array.isArray(user.investments)) {
        user.investments = [];
      }

      const amount =
        parseFloat(
          document.getElementById(
            'newInvestmentAmount'
          ).value || 0
        );

      const monthlyRate =
        parseFloat(
          document.getElementById(
            'newInvestmentMonthlyRate'
          ).value || 0
        );

      const feeFreeMonths =
        parseFloat(
          document.getElementById(
            'newInvestmentFeeMonths'
          ).value || 0
        );

      const type =
        document.getElementById(
          'newInvestmentType'
        ).value;

      if (amount <= 0) {
        alert(
          'יש להזין סכום השקעה גדול מאפס.'
        );
        return;
      }

      user.investments.push({
        id:
          'inv-' +
          Date.now().toString() +
          '-' +
          Math.random().toString(16).slice(2),

        type: type,

        amount: amount,

        monthlyRate: monthlyRate,

        feeFreeMonths: feeFreeMonths,

        createdAt: Date.now()
      });

      syncLegacyInvestValue(user);

      saveStorageData();

      closeModal('investmentModal');

      render();
    }

    function releaseInvestmentToWallet(investmentId) {
      const user =
        findNode(treeData, selectedId);

      if (!user ||
          !Array.isArray(user.investments)) {
        return;
      }

      const inv =
        user.investments.find(
          i => i.id === investmentId
        );

      if (!inv ||
          inv.releasedToWallet) {
        return;
      }

      if (inv.type !== 'thunder') {
        alert(
          'ב-UNAI Engine הקרן והרווחים משתחררים אוטומטית לארנק רק לאחר שנתיים ממועד ההשקעה.'
        );
        return;
      }

      if (!isThunderEligible(inv)) {
        alert(
          'הקרן עדיין אינה זמינה לשחרור.'
        );
        return;
      }

      // לפני שחרור הקרן, משלמים את כל הריבית היומית שהצטברה עד עכשיו.
      processInvestmentWalletEvents(user);

      const principal =
        parseFloat(inv.amount || 0);

      if (principal <= 0) return;

      user.walletBalance =
        parseFloat(user.walletBalance || 0) +
        principal;

      inv.releasedToWallet = true;
      inv.principalReleased = true;
      inv.releasedAt = Date.now();
      inv.releasedAmount = principal;

      syncLegacyInvestValue(user);

      saveStorageData();

      render();
    }

    function getAllUsers() {
      const users = [];

      function walk(node) {
        if (!node) return;

        users.push(node);

        (node.children || []).forEach(walk);
      }

      walk(treeData);

      return users;
    }

    function openTransferModal() {
      const user =
        findNode(treeData, selectedId);

      if (!user) {
        alert(
          'בחר משתמש בעץ לפני העברת כסף.'
        );
        return;
      }

      const balance =
        parseFloat(user.walletBalance || 0);

      if (balance <= 0) {
        alert(
          'אין מספיק כסף בארנק להעברה.'
        );
        return;
      }

      const select =
        document.getElementById(
          'transferToUser'
        );

      select.innerHTML = '';

      getAllUsers()
        .filter(u => u.id !== user.id)
        .forEach(u => {
          const option =
            document.createElement('option');

          option.value = u.id;

          option.innerText =
            u.email || '(ללא אימייל)';

          select.appendChild(option);
        });

      if (select.options.length === 0) {
        alert(
          'אין משתמש אחר שאליו ניתן להעביר כסף.'
        );
        return;
      }

      document.getElementById(
        'transferFromUser'
      ).innerText =
        `שולח: ${user.email || '(ללא אימייל)'} | יתרה זמינה: $${formatMoney(balance)}`;

      document.getElementById(
        'transferAmount'
      ).value = '';

      document.getElementById(
        'transferModal'
      ).classList.add('active');
    }

    function transferWalletMoney() {
      const from =
        findNode(treeData, selectedId);

      const to =
        findNode(
          treeData,
          document.getElementById(
            'transferToUser'
          ).value
        );

      const amount =
        parseFloat(
          document.getElementById(
            'transferAmount'
          ).value || 0
        );

      if (!from || !to) return;

      if (amount <= 0) {
        alert(
          'יש להזין סכום גדול מאפס.'
        );
        return;
      }

      const fromBalance =
        parseFloat(from.walletBalance || 0);

      if (amount > fromBalance) {
        alert(
          'אין מספיק כסף בארנק להעברה.'
        );
        return;
      }

      from.walletBalance =
        fromBalance - amount;

      to.walletBalance =
        parseFloat(to.walletBalance || 0) +
        amount;

      saveStorageData();

      closeModal('transferModal');

      render();

      alert(
        `הועברו $${formatMoney(amount)} בהצלחה.`
      );
    }

    function changePassword(e) {
      e.preventDefault();

      let userId =
        document.getElementById(
          'passUserSelect'
        ).value;

      let newPass =
        document.getElementById(
          'newPassVal'
        ).value;

      let user =
        findNode(treeData, userId);

      if (user) {
        user.pass = newPass;

        saveStorageData();

        alert(
          `הסיסמה עבור @${user.username} עודכנה בהצלחה!`
        );

        document.getElementById(
          'newPassVal'
        ).value = '';

        closeModal('passModal');
      }
    }

    function saveConfig() {
      rankReq.sales =
        parseFloat(
          document.getElementById(
            'cfgSales'
          ).value
        ) || 0;

      rankReq.invest =
        parseFloat(
          document.getElementById(
            'cfgInvest'
          ).value
        ) || 0;

      rankReq.members =
        parseFloat(
          document.getElementById(
            'cfgMembers'
          ).value
        ) || 0;

      rankReq.grp =
        parseFloat(
          document.getElementById(
            'cfgGrp'
          ).value
        ) || 0;

      saveStorageData();

      closeModal('rankModal');

      render();
    }

    function resetSystemData() {
      document.getElementById(
        'dropdownMenu'
      ).classList.remove('active');

      if (
        confirm(
          "איפוס נתונים ימחק את כל העץ ויחזיר את המערכת למצב התחלתי. להמשיך?"
        )
      ) {
        treeData = null;
        selectedId = null;

        localStorage.removeItem(
          STORAGE_KEY_TREE
        );

        localStorage.removeItem(
          STORAGE_KEY_RANK
        );

        render();
      }
    }

    function openModal(id) {
      if (id === 'rankModal') {
        document.getElementById(
          'cfgSales'
        ).value = rankReq.sales;

        document.getElementById(
          'cfgInvest'
        ).value = rankReq.invest;

        document.getElementById(
          'cfgMembers'
        ).value = rankReq.members;

        document.getElementById(
          'cfgGrp'
        ).value = rankReq.grp;
      }

      document.getElementById(
        id
      ).classList.add('active');
    }

    function closeModal(id) {
      document.getElementById(
        id
      ).classList.remove('active');
    }

    function toggleDropdown() {
      document.getElementById(
        'dropdownMenu'
      ).classList.toggle('active');
    }

    function closeDropdown() {
      document.getElementById(
        'dropdownMenu'
      ).classList.remove('active');
    }

    document.addEventListener('click', function(e) {
      const menu =
        document.querySelector('.menu-wrap');

      if (!menu.contains(e.target)) {
        closeDropdown();
      }
    });

    document.querySelectorAll('.modal-overlay')
      .forEach(overlay => {
        overlay.addEventListener('click', function(e) {
          if (e.target === overlay) {
            overlay.classList.remove('active');
          }
        });
      });

    loadStorageData();
    render();

    setInterval(() => {
      updateInvestmentTimers();
    }, 1000);
  </script>
</body>
  </html>
