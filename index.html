<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Universe Pro System</title>
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --accent-green: #22c55e;
      --accent-purple: #a855f7;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --border-color: #334155;
      --danger-color: #ef4444;
      --warning-color: #eab308;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      padding: 20px;
      direction: rtl;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
    }

    .card {
      background-color: var(--card-bg);
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 20px;
      border: 1px solid var(--border-color);
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3);
    }

    h2, h3 {
      margin-bottom: 15px;
      color: var(--text-main);
    }

    .grid-2 {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 20px;
    }

    .form-group {
      margin-bottom: 15px;
    }

    label {
      display: block;
      margin-bottom: 5px;
      color: var(--text-muted);
      font-size: 0.9rem;
    }

    input, select, button {
      width: 100%;
      padding: 10px 14px;
      border-radius: 8px;
      border: 1px solid var(--border-color);
      background-color: #0f172a;
      color: var(--text-main);
      font-size: 1rem;
      outline: none;
    }

    button {
      background-color: var(--accent-purple);
      color: white;
      font-weight: bold;
      cursor: pointer;
      border: none;
      transition: opacity 0.2s;
      margin-top: 5px;
    }

    button:hover {
      opacity: 0.9;
    }

    button.btn-success {
      background-color: var(--accent-green);
    }

    button.btn-warning {
      background-color: var(--warning-color);
      color: #000;
    }

    /* עץ ארגוני - חיבור קווים ועיגול */
    .tree-container {
      overflow-x: auto;
      padding: 20px 0;
    }

    .tree, .tree ul, .tree li {
      list-style: none;
      margin: 0;
      padding: 0;
      position: relative;
      text-align: center;
    }

    .tree {
      display: flex;
      justify-content: center;
    }

    .tree ul {
      display: flex;
      padding-top: 20px;
      position: relative;
    }

    .tree ul::before {
      content: '';
      position: absolute;
      top: 0;
      left: 50%;
      border-left: 2px solid var(--accent-purple);
      width: 0;
      height: 20px;
    }

    .tree li {
      padding: 20px 10px 0 10px;
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .tree li::before, .tree li::after {
      content: '';
      position: absolute;
      top: 0;
      right: 50%;
      border-top: 2px solid var(--accent-purple);
      width: 50%;
      height: 20px;
    }

    .tree li::after {
      right: auto;
      left: 50%;
      border-left: 2px solid var(--accent-purple);
    }

    .tree li:only-child::after, .tree li:only-child::before {
      display: none;
    }

    .tree li:only-child {
      padding-top: 0;
    }

    .tree li:first-child::before, .tree li:last-child::after {
      border: none;
    }

    .tree li:last-child::before {
      border-right: 2px solid var(--accent-purple);
      border-radius: 0 5px 0 0;
    }

    .tree li:first-child::after {
      border-radius: 5px 0 0 0;
    }

    .node-circle {
      width: 60px;
      height: 60px;
      border-radius: 50%;
      background-color: var(--accent-purple);
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      font-size: 1.1rem;
      border: 3px solid #ffffff;
      box-shadow: 0 0 10px rgba(168, 85, 247, 0.5);
      z-index: 2;
    }

    .node-email {
      margin-top: 8px;
      font-size: 0.85rem;
      color: var(--text-main);
      white-space: nowrap;
    }

    .node-name {
      font-size: 0.75rem;
      color: var(--text-muted);
      white-space: nowrap;
    }

    /* טיימרים וסטטוסים */
    .timer-box {
      background: #0f172a;
      padding: 12px;
      border-radius: 8px;
      margin-top: 10px;
      border: 1px solid var(--border-color);
    }

    .status-red {
      color: var(--danger-color);
      font-weight: bold;
    }

    .status-yellow {
      color: var(--warning-color);
      font-weight: bold;
    }

    .status-green {
      color: var(--accent-green);
      font-weight: bold;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 10px;
    }

    th, td {
      padding: 10px;
      text-align: right;
      border-bottom: 1px solid var(--border-color);
    }

    th {
      color: var(--text-muted);
    }
  </style>
</head>
<body>

<div class="container">
  <h2>מערכת ניהול Universe Pro</h2>

  <div class="grid-2">
    <!-- הוספת משתמש / ארגון -->
    <div class="card">
      <h3>הוספת שותף לארגון</h3>
      <div class="form-group">
        <label>שם בארגון</label>
        <input type="text" id="userName" placeholder="הכנס שם בארגון">
      </div>
      <div class="form-group">
        <label>אימייל</label>
        <input type="email" id="userEmail" placeholder="user@example.com">
      </div>
      <div class="form-group">
        <label>מזהה ארגון (מזהה הורה/ספונסר)</label>
        <input type="number" id="parentId" placeholder="השאר ריק אם זה הראשי">
      </div>
      <button onclick="addUser()">הוסף משתמש</button>
    </div>

    <!-- ביצוע השקעה -->
    <div class="card">
      <h3>ביצוע השקעה / העברה</h3>
      <div class="form-group">
        <label>מזהה ארגון מבוצע</label>
        <input type="number" id="investUserId" placeholder="הכנס מזהה ארגון">
      </div>
      <div class="form-group">
        <label>סכום השקעה ($)</label>
        <input type="number" step="0.01" id="investAmount" placeholder="0.00">
      </div>
      <div class="form-group">
        <label>סוג מסלול השקעה</label>
        <select id="investType">
          <option value="unai">קרן לשנתיים - UNAI Engine</option>
          <option value="tender">טנדר ⚡ (4 חודשים)</option>
        </select>
      </div>
      <button class="btn-success" onclick="processInvestment()">בצע השקעה ⚡</button>
    </div>
  </div>

  <!-- מפת העץ -->
  <div class="card">
    <h3>מפת ארגון (עץ שיווקי)</h3>
    <div class="tree-container">
      <div id="treeView" class="tree"></div>
    </div>
  </div>

  <!-- טיימרים וריבית יומית -->
  <div class="card">
    <h3>טיימרים וריבית יומית</h3>
    <div id="timersList"></div>
  </div>

  <!-- היסטוריית השקעות -->
  <div class="card">
    <h3>היסטוריית השקעות</h3>
    <table>
      <thead>
        <tr>
          <th>מזהה ארגון</th>
          <th>שם בארגון</th>
          <th>סכום השקעה</th>
          <th>מסלול</th>
          <th>תאריך</th>
        </tr>
      </thead>
      <tbody id="investmentsTable"></tbody>
    </table>
  </div>
</div>

<script>
  // איפוס נתונים להתחלה נקייה מאפס
  localStorage.removeItem('universe_pro_users');
  localStorage.removeItem('universe_pro_investments');

  let users = [];
  let investments = [];
  let nextOrgId = 1001;

  function addUser() {
    const name = document.getElementById('userName').value;
    const email = document.getElementById('userEmail').value;
    const parentId = parseInt(document.getElementById('parentId').value) || null;

    if (!name || !email) {
      alert('נא למלא שם בארגון ואימייל');
      return;
    }

    const newUser = {
      id: nextOrgId++,
      name: name,
      email: email,
      parentId: parentId
    };

    users.push(newUser);
    document.getElementById('userName').value = '';
    document.getElementById('userEmail').value = '';
    document.getElementById('parentId').value = '';

    renderTree();
    renderTimers();
  }

  function processInvestment() {
    const userId = parseInt(document.getElementById('investUserId').value);
    const amount = parseFloat(document.getElementById('investAmount').value);
    const type = document.getElementById('investType').value;

    const user = users.find(u => u.id === userId);
    if (!user) {
      alert('מזהה ארגון לא נמצא');
      return;
    }

    if (isNaN(amount) || amount <= 0) {
      alert('נא להזין סכום תקין');
      return;
    }

    const newInvest = {
      id: Date.now(),
      userId: userId,
      userName: user.name,
      amount: amount,
      type: type,
      startDate: new Date(),
      lastResetDate: new Date(),
      withdrawn: false
    };

    investments.push(newInvest);
    document.getElementById('investUserId').value = '';
    document.getElementById('investAmount').value = '';

    renderInvestmentsTable();
    renderTimers();
  }

  function renderTree() {
    const treeContainer = document.getElementById('treeView');
    treeContainer.innerHTML = '';

    if (users.length === 0) {
      treeContainer.innerHTML = '<p style="color: var(--text-muted);">אין משתמשים בארגון כרגע</p>';
      return;
    }

    const rootUsers = users.filter(u => !u.parentId || !users.some(parent => parent.id === u.parentId));

    const ul = document.createElement('ul');
    rootUsers.forEach(root => {
      ul.appendChild(buildTreeNode(root));
    });
    treeContainer.appendChild(ul);
  }

  function buildTreeNode(user) {
    const li = document.createElement('li');

    li.innerHTML = `
      <div class="node-circle">${user.id}</div>
      <div class="node-email">${user.email}</div>
      <div class="node-name">${user.name}</div>
    `;

    const children = users.filter(u => u.parentId === user.id);
    if (children.length > 0) {
      const ul = document.createElement('ul');
      children.forEach(child => {
        ul.appendChild(buildTreeNode(child));
      });
      li.appendChild(ul);
    }

    return li;
  }

  function renderInvestmentsTable() {
    const tbody = document.getElementById('investmentsTable');
    tbody.innerHTML = '';

    investments.forEach(inv => {
      const tr = document.createElement('tr');
      const typeLabel = inv.type === 'tender' ? 'טנדר ⚡ (4 חודשים)' : 'קרן לשנתיים - UNAI Engine';
      tr.innerHTML = `
        <td>${inv.userId}</td>
        <td>${inv.userName}</td>
        <td>$${inv.amount.toLocaleString('he-IL', {minimumFractionDigits: 2, maximumFractionDigits: 2})}</td>
        <td>${typeLabel}</td>
        <td>${new Date(inv.startDate).toLocaleDateString('he-IL')}</td>
      `;
      tbody.appendChild(tr);
    });
  }

  function renderTimers() {
    const container = document.getElementById('timersList');
    container.innerHTML = '';

    if (investments.length === 0) {
      container.innerHTML = '<p style="color: var(--text-muted);">אין השקעות פעילות</p>';
      return;
    }

    investments.forEach(inv => {
      const box = document.createElement('div');
      box.className = 'timer-box';

      if (inv.type === 'unai') {
        box.innerHTML = `
          <strong>מזהה ארגון: ${inv.userId} (${inv.userName})</strong> - קרן לשנתיים (UNAI Engine)<br>
          סכום: $${inv.amount.toFixed(2)}<br>
          <span class="status-yellow">זמן נעילה מתוכנן: 24 חודשים</span>
        `;
      } else if (inv.type === 'tender') {
        box.id = `timer-box-${inv.id}`;
        box.innerHTML = `
          <strong>מזהה ארגון: ${inv.userId} (${inv.userName})</strong> - השקעת טנדר ⚡<br>
          סכום: $${inv.amount.toFixed(2)} | <span id="daily-yield-${inv.id}">מחשב ריבית יומית...</span><br>
          סטטוס טיימר: <span id="timer-status-${inv.id}">מחשב...</span>
        `;
      }
      container.appendChild(box);
    });

    updateTenderTimers();
  }

  function updateTenderTimers() {
    const now = new Date().getTime();

    investments.forEach(inv => {
      if (inv.type !== 'tender') return;

      const statusElem = document.getElementById(`timer-status-${inv.id}`);
      const yieldElem = document.getElementById(`daily-yield-${inv.id}`);
      if (!statusElem) return;

      // ריבית יומית מצטברת
      const daysElapsed = (now - new Date(inv.startDate).getTime()) / (1000 * 60 * 60 * 24);
      const accumulatedYield = (inv.amount * 0.005 * daysElapsed);
      if (yieldElem) {
        yieldElem.innerHTML = `רווח יומי מצטבר: <strong style="color:var(--accent-green)">+$${accumulatedYield.toFixed(4)}</strong>`;
      }

      // אם הקרן נמשכה - מציג ירוק
      if (inv.withdrawn) {
        statusElem.className = 'status-green';
        statusElem.innerHTML = 'הקרן נמשכה בהצלחה! ✔';
        return;
      }

      const fourMonthsMs = 4 * 30 * 24 * 60 * 60 * 1000;
      const seventyTwoHoursMs = 72 * 60 * 60 * 1000;

      const elapsed = now - new Date(inv.lastResetDate).getTime();

      if (elapsed < fourMonthsMs) {
        // 4 חודשים - באדום
        const remaining = fourMonthsMs - elapsed;
        const days = Math.floor(remaining / (1000 * 60 * 60 * 24));
        const hours = Math.floor((remaining % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
        statusElem.className = 'status-red';
        statusElem.innerHTML = `נעול ל-4 חודשים (נותרו ${days} ימים ו-${hours} שעות)`;
      } else if (elapsed < fourMonthsMs + seventyTwoHoursMs) {
        // 72 שעות - בצהוב עם כפתור משיכה
        const windowElapsed = elapsed - fourMonthsMs;
        const remaining = seventyTwoHoursMs - windowElapsed;
        const hours = Math.floor(remaining / (1000 * 60 * 60));
        const minutes = Math.floor((remaining % (1000 * 60 * 60)) / (1000 * 60));

        statusElem.className = 'status-yellow';
        statusElem.innerHTML = `
          חלון משיכה פתוח! (נותרו ${hours} שעות ו-${minutes} דקות)
          <br>
          <button class="btn-warning" style="width: auto; padding: 5px 15px; margin-top: 8px;" onclick="withdrawPrincipal(${inv.id})">משוך קרן עכשיו</button>
        `;
      } else {
        // עברו 72 שעות ללא משיכה - מתאפס מחדש ל-4 חודשים באדום
        inv.lastResetDate = new Date();
        renderTimers();
      }
    });
  }

  function withdrawPrincipal(invId) {
    const inv = investments.find(i => i.id === invId);
    if (inv) {
      inv.withdrawn = true;
      renderTimers();
    }
  }

  setInterval(updateTenderTimers, 1000);

  renderTree();
  renderTimers();
</script>

</body>
</html>
